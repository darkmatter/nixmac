name: Publish Computer Use E2E Terminal Report
run-name: Publish E2E report · PR #${{ inputs.pull_request }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      evidence_dir:
        description: "Absolute evidence directory on the configured remote Mac"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character nixmac app SHA exercised by CuaDriver"
        required: true
        type: string
      pull_request:
        description: "Pull request number"
        required: true
        type: string
      request_id:
        description: "Buzz/Centaur request ID"
        required: true
        type: string
      report_tool_sha:
        description: "Exact nixmac SHA containing the report renderer to execute"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  render:
    name: Validate and render terminal evidence
    runs-on: arc
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.validate.outputs.verdict }}
    env:
      REMOTE_HOST: ${{ secrets.NIXMAC_E2E_REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.NIXMAC_E2E_REMOTE_USER }}
      REMOTE_SSH_KEY: ${{ secrets.NIXMAC_E2E_REMOTE_SSH_KEY }}
      REMOTE_KNOWN_HOSTS: ${{ secrets.NIXMAC_E2E_REMOTE_KNOWN_HOSTS }}
    steps:
      - name: Checkout pinned report tool
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.report_tool_sha }}
          fetch-depth: 1

      - name: Prepare evidence transport and media validation
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$REMOTE_HOST" ]] || missing+=("NIXMAC_E2E_REMOTE_HOST")
          [[ -n "$REMOTE_USER" ]] || missing+=("NIXMAC_E2E_REMOTE_USER")
          [[ -n "$REMOTE_SSH_KEY" ]] || missing+=("NIXMAC_E2E_REMOTE_SSH_KEY")
          [[ -n "$REMOTE_KNOWN_HOSTS" ]] || missing+=("NIXMAC_E2E_REMOTE_KNOWN_HOSTS")
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "Missing remote evidence secrets: ${missing[*]}" >&2
            exit 1
          fi
          [[ "$REMOTE_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || {
            echo "Configured remote user has an invalid format" >&2
            exit 1
          }

          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for command_name in git jq node realpath scp ssh ffprobe; do
            command -v "$command_name" >/dev/null || {
              echo "Required report command is unavailable: $command_name" >&2
              exit 1
            }
          done

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$REMOTE_SSH_KEY" > "$HOME/.ssh/nixmac-e2e"
          chmod 600 "$HOME/.ssh/nixmac-e2e"
          printf '%s\n' "$REMOTE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$REMOTE_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "Configured known_hosts does not contain the remote evidence host" >&2
            exit 1
          }

      - name: Fetch, validate, and render terminal evidence
        id: validate
        shell: bash
        env:
          EVIDENCE_DIR_INPUT: ${{ inputs.evidence_dir }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pull_request }}
          REQUEST_ID: ${{ inputs.request_id }}
          REPORT_TOOL_SHA: ${{ inputs.report_tool_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "expected_sha must be a full lowercase git SHA" >&2
            exit 1
          }
          [[ "$REPORT_TOOL_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "report_tool_sha must be a full lowercase git SHA" >&2
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "pull_request must be a positive integer" >&2
            exit 1
          }
          [[ "$REQUEST_ID" =~ ^[a-z0-9][a-z0-9._:-]{0,79}$ ]] || {
            echo "request_id has an invalid format" >&2
            exit 1
          }

          checked_out_sha="$(git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$REPORT_TOOL_SHA" ]] || {
            echo "Pinned report tool mismatch: expected $REPORT_TOOL_SHA, got $checked_out_sha" >&2
            exit 1
          }

          expected_prefix="/Users/${REMOTE_USER}/nixmac-e2e-evidence/${EXPECTED_SHA}/"
          [[ "$EVIDENCE_DIR_INPUT" == "$expected_prefix"* ]] || {
            echo "Evidence directory is outside the exact-SHA evidence boundary" >&2
            exit 1
          }
          relative_run="${EVIDENCE_DIR_INPUT#"$expected_prefix"}"
          [[ "$relative_run" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}Z$ ]] || {
            echo "Evidence directory must be one run directly beneath the exact SHA" >&2
            exit 1
          }

          ssh_common=(
            -i "$HOME/.ssh/nixmac-e2e"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh_dest="${REMOTE_USER}@${REMOTE_HOST}"
          local_evidence="$RUNNER_TEMP/terminal-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$local_evidence"
          remote_manifest="${EVIDENCE_DIR_INPUT}/terminal-result.v1.json"
          scp "${ssh_common[@]}" -- "$ssh_dest:$remote_manifest" "$local_evidence/terminal-result.remote.json"

          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --argjson pr "$PR_NUMBER" \
            --arg request "$REQUEST_ID" \
            --arg tool "$REPORT_TOOL_SHA" \
            --arg evidence "$EVIDENCE_DIR_INPUT" \
            '.schemaVersion == "nixmac.e2e.terminal-result.v1"
              and .testedArtifact.headSha == $sha
              and .request.pullRequest.number == $pr
              and .request.id == $request
              and .reportTool.repository == "darkmatter/nixmac"
              and .reportTool.sha == $tool
              and .evidence.root == $evidence' \
            "$local_evidence/terminal-result.remote.json" >/dev/null

          mapfile -t evidence_paths < <(
            jq -r '[.evidence.screenshots[].path, .evidence.video.path] | .[]' \
              "$local_evidence/terminal-result.remote.json"
          )
          if [[ "${#evidence_paths[@]}" -lt 3 || "${#evidence_paths[@]}" -gt 7 ]]; then
            echo "Manifest must reference two to six screenshots and one video" >&2
            exit 1
          fi
          for relative_path in "${evidence_paths[@]}"; do
            [[ "$relative_path" =~ ^[A-Za-z0-9._/-]+$ ]] &&
              [[ "$relative_path" != /* ]] &&
              [[ "/$relative_path/" != *"/../"* ]] &&
              [[ "/$relative_path/" != *"/./"* ]] || {
                echo "Unsafe evidence path in manifest: $relative_path" >&2
                exit 1
              }
            mkdir -p "$local_evidence/$(dirname "$relative_path")"
            scp "${ssh_common[@]}" -- \
              "$ssh_dest:${EVIDENCE_DIR_INPUT}/${relative_path}" \
              "$local_evidence/$relative_path"
          done

          manifest="$local_evidence/terminal-result.v1.json"
          jq --arg evidence "$local_evidence" '.evidence.root = $evidence' \
            "$local_evidence/terminal-result.remote.json" > "$manifest"

          mkdir -p artifacts/terminal-report-private artifacts/terminal-report-public
          node tests/e2e/computer-use/terminal-report.mjs render \
            --input "$manifest" \
            --output-dir artifacts/terminal-report-private
          cp artifacts/terminal-report-private/index.html artifacts/terminal-report-public/index.html

          verdict="$(jq -r '.verdict' artifacts/terminal-report-private/terminal-result.normalized.json)"
          {
            echo "verdict=$verdict"
          } >> "$GITHUB_OUTPUT"

      - name: Upload self-contained report
        uses: actions/upload-artifact@v7
        with:
          name: computer-use-terminal-report
          path: artifacts/terminal-report-public/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize validated product result
        shell: bash
        env:
          VERDICT: ${{ steps.validate.outputs.verdict }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          {
            echo "## Computer Use terminal result"
            echo
            echo "- Product verdict: \`$VERDICT\`"
            echo "- Pull request: #$PR_NUMBER"
            echo "- Exact tested SHA: \`$EXPECTED_SHA\`"
            echo "- Report publication: pending in the separate publish job"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish terminal report
    needs: render
    if: always() && needs.render.result == 'success'
    runs-on: arc
    timeout-minutes: 15
    steps:
      - name: Checkout pinned report tool
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.report_tool_sha }}
          fetch-depth: 1

      - name: Download self-contained report
        uses: actions/download-artifact@v7
        with:
          name: computer-use-terminal-report
          path: artifacts/terminal-report-public

      - name: Check whether the tested SHA is still current
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          pull_request_json="$RUNNER_TEMP/pull-request-${PR_NUMBER}.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$pull_request_json"
          node tests/e2e/computer-use/latest-report-eligibility.mjs check \
            --input "$pull_request_json" \
            --expected-sha "$EXPECTED_SHA"

      - name: Publish report
        id: publish-report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: artifacts/terminal-report-public
          REPORT_PREFIX: computer-use-e2e/terminal/pr-${{ inputs.pull_request }}
          PUBLISH_PATH: computer-use-e2e/terminal/pr-${{ inputs.pull_request }}/run-${{ github.run_id }}-${{ github.run_attempt }}
          LATEST_PATH: computer-use-e2e/terminal/pr-${{ inputs.pull_request }}/latest
          INDEX_URL: https://darkmatter.github.io/nixmac/computer-use-e2e/terminal/pr-${{ inputs.pull_request }}/run-${{ github.run_id }}-${{ github.run_attempt }}/index.html
          LATEST_INDEX_URL: https://darkmatter.github.io/nixmac/computer-use-e2e/terminal/pr-${{ inputs.pull_request }}/latest/index.html
          RUN_ASSET_BASE_URL: https://darkmatter.github.io/nixmac/computer-use-e2e/terminal/pr-${{ inputs.pull_request }}/run-${{ github.run_id }}-${{ github.run_attempt }}/
          RETENTION_KEEP_RUNS: "20"
          PR_NUMBER: ${{ inputs.pull_request }}
          UPDATE_LATEST: ${{ steps.latest.outputs.update_latest }}
        run: ops/scripts/e2e/publish-report.sh

      - name: Summarize publication result
        shell: bash
        env:
          PRODUCT_VERDICT: ${{ needs.render.outputs.verdict }}
          INDEX_URL: ${{ steps.publish-report.outputs.index_url }}
          LATEST_INDEX_URL: ${{ steps.publish-report.outputs.latest_index_url }}
          LATEST_UPDATED: ${{ steps.publish-report.outputs.latest_updated }}
        run: |
          {
            echo "## Published Computer Use report"
            echo
            echo "- Product verdict: \`$PRODUCT_VERDICT\`"
            echo "- Report status: \`published\`"
            echo "- Immutable report: $INDEX_URL"
            if [[ "$LATEST_UPDATED" == "true" ]]; then
              echo "- Latest alias: $LATEST_INDEX_URL"
            else
              echo "- Latest alias: not updated because the tested SHA is no longer current"
            fi
            echo
            echo "A report publication failure fails this delivery job only; it does not rewrite the validated product verdict."
          } >> "$GITHUB_STEP_SUMMARY"
