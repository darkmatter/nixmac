name: macOS CI Image

# =============================================================================
# Builds and publishes the nixmac macOS CI tart image to GHCR.
#
 # Builds the minimal nixmac macOS Tart image:
 #   macos-tahoe-base (pinned digest) + one supplied Xcode artifact.
 #
 # Nix, devenv, Bun, Rust, Cargo, and node_modules remain remote/lockfile-keyed
 # caches and are installed by the existing build workflow.
#
#
 # Base reference is pinned by digest in ops/images/nixmac-runner-tahoe.pkr.hcl;
 # this workflow does not resolve floating image tags at build time.
# Triggers:
#   - Manual dispatch until this workflow completes one qualified image build.
#   - After the dedicated builder's capacity and registry round-trip are
#     verified, re-enable push/schedule triggers.
#
# SECURITY: The Packer template uses public inputs only (no secrets). A
# secret-scan step runs before push and fails the build if any known secret
# pattern is found in the exported image.
# =============================================================================

on:
  workflow_call:
    inputs:
      xcode_artifact:
        description: "Absolute path to approved Xcode 26.x .xip/.pkg on the builder"
        required: true
        type: string
      xcode_artifact_type:
        description: "Xcode artifact extension"
        required: true
        type: string
      xcode_artifact_sha256:
        description: "Approved Xcode artifact SHA-256"
        required: true
        type: string
    outputs:
      image:
        description: "Digest-qualified published image"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Published OCI manifest digest"
        value: ${{ jobs.build.outputs.digest }}
      xcode_artifact_sha256:
        description: "Approved Xcode artifact SHA-256"
        value: ${{ jobs.build.outputs.xcode_artifact_sha256 }}
      e2e_image:
        description: "Digest-qualified Computer Use E2E image"
        value: ${{ jobs.build.outputs.e2e_image }}
      e2e_image_digest:
        description: "Computer Use E2E OCI manifest digest"
        value: ${{ jobs.build.outputs.e2e_image_digest }}
      e2e_image_built_at:
        description: "Canonical UTC build timestamp for E2E image age admission"
        value: ${{ jobs.build.outputs.e2e_image_built_at }}
  workflow_dispatch:
    inputs:
      xcode_artifact:
        description: "Absolute path to approved Xcode 26.x .xip/.pkg on the builder"
        required: true
        type: string
      xcode_artifact_type:
        description: "Xcode artifact extension"
        required: true
        type: choice
        options: [xip, pkg]
        default: xip
      xcode_artifact_sha256:
        description: "Approved Xcode artifact SHA-256"
        required: true
        type: string
# Re-enable after the image-builder host is prepared:
# on:
#   push:
#     branches: [main]
#     paths:
#       - ops/images/**
#       - .github/workflows/macos-ci-image.yaml
#       - nix/**
#       - devenv.nix
#       - flake.nix
#       - flake.lock
#       - treefmt.nix
#       - package.json
#       - bun.lock
#   schedule:
#     - cron: "0 10 * * 0"
#   workflow_dispatch:

concurrency:
  group: macos-ci-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nixmac-runner
  E2E_IMAGE_NAME: ${{ github.repository_owner }}/nixmac-e2e-runner
  BASE_IMAGE_DIGEST: sha256:a8e1c8305758643f513fdccdd829c2243687c60791083dea42f73f0b7aeb435c

jobs:
  build:
    name: Build and push macOS CI image
    # Dedicated image-builder host only; never use production nixmac-mac
    # runners. The Xcode artifact is supplied at manual dispatch time.
    runs-on: [self-hosted, macOS, nixmac-image-builder]
    timeout-minutes: 300
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      xcode_artifact_sha256: ${{ steps.xcode-artifact.outputs.sha256 }}
      e2e_image: ${{ steps.push-e2e.outputs.image }}
      e2e_image_digest: ${{ steps.push-e2e.outputs.digest }}
      e2e_image_built_at: ${{ steps.push-e2e.outputs.built_at }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Provision image tooling
        shell: bash
        run: bash ops/images/provision-image-builder.sh

      - name: Initialize Packer plugins
        shell: bash
        run: |
          cd ops/images
          packer init nixmac-runner-tahoe.pkr.hcl

      - name: Validate Xcode artifact
        id: xcode-artifact
        shell: bash
        env:
          XCODE_ARTIFACT: ${{ inputs.xcode_artifact }}
          XCODE_ARTIFACT_TYPE: ${{ inputs.xcode_artifact_type }}
          EXPECTED_XCODE_ARTIFACT_SHA256: ${{ inputs.xcode_artifact_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$XCODE_ARTIFACT" ]; then
            echo "::error::xcode_artifact is required for image builds"
            exit 1
          fi
          case "$XCODE_ARTIFACT_TYPE" in
            xip|pkg) ;;
            *)
              echo "::error::unsupported Xcode artifact type: $XCODE_ARTIFACT_TYPE"
              exit 1
              ;;
          esac
          test -f "$XCODE_ARTIFACT"
          digest="$(shasum -a 256 "$XCODE_ARTIFACT" | awk '{print $1}')"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve Xcode artifact SHA-256"
            exit 1
          fi
          if [[ ! "$EXPECTED_XCODE_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::xcode_artifact_sha256 must be a lowercase SHA-256"
            exit 1
          fi
          if [ "$digest" != "$EXPECTED_XCODE_ARTIFACT_SHA256" ]; then
            echo "::error::Xcode artifact does not match the approved SHA-256"
            exit 1
          fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Qualify base-image connectivity
        shell: bash
        run: bash ops/images/check-base-image-connectivity.sh

      - name: Build image
        id: build
        shell: bash
        env:
          XCODE_ARTIFACT: ${{ inputs.xcode_artifact }}
          XCODE_ARTIFACT_TYPE: ${{ inputs.xcode_artifact_type }}
        run: |
          cd ops/images
          test -f "$XCODE_ARTIFACT"
          packer build \
            -var "base_image_digest=$BASE_IMAGE_DIGEST" \
            -var "xcode_artifact=$XCODE_ARTIFACT" \
            -var "xcode_artifact_type=$XCODE_ARTIFACT_TYPE" \
            nixmac-runner-tahoe.pkr.hcl

      - name: Secret scan (pre-push gate)
        id: secret-scan
        shell: bash
        run: |
          set -euo pipefail
          # Fail-closed: if we cannot start the VM, get its IP, SSH in, and
          # scan, the image is NOT pushed. The Packer template uses public
          # inputs only, but this gate enforces it — never skip.
          VM_NAME="nixmac-runner-tahoe"

          echo "::group::Starting VM for secret scan"
          # Packer leaves the VM stopped; start it in the background.
          tart run --no-graphics "$VM_NAME" &>/tmp/tart-scan-run.log &
          TART_PID=$!

          # Wait up to 5 min for the VM to get an IP.
          TART_IP=""
          for _ in $(seq 1 60); do
            TART_IP=$(tart ip "$VM_NAME" 2>/dev/null || true)
            if [ -n "$TART_IP" ]; then break; fi
            sleep 5
          done

          if [ -z "$TART_IP" ]; then
            echo "::error::Could not get VM IP after 5 min; refusing to push unscanned image"
            kill "$TART_PID" 2>/dev/null || true
            tart stop "$VM_NAME" 2>/dev/null || true
            exit 1
          fi
          echo "VM IP: $TART_IP"

          # Wait for SSH to be available.
          for _ in $(seq 1 30); do
            if env SSH_PASSWORD=admin bash ops/images/ssh-vm.sh "admin@$TART_IP" true 2>/dev/null; then
              break
            fi
            sleep 5
          done

          if ! env SSH_PASSWORD=admin bash ops/images/ssh-vm.sh "admin@$TART_IP" true 2>/dev/null; then
            kill "$TART_PID" 2>/dev/null || true
            tart stop "$VM_NAME" 2>/dev/null || true
            exit 1
          fi
          echo "::group::Verifying Xcode after VM start"
          if ! env SSH_PASSWORD=admin bash ops/images/ssh-vm.sh "admin@$TART_IP" \
            'set -eu; test -x /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild; xcodebuild -version; xcrun --sdk macosx --show-sdk-path'; then
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Scanning provisioning-owned paths for secrets"
          # Send a standalone script to the VM. Keeping the script separate
          # avoids local shell expansion in the SSH command string.
          cat > /tmp/scan-vm.sh <<'SCAN'
          #!/bin/bash
          set -eu
          targets=""
          for path in /Users/admin/.zprofile /Users/admin/.zshrc /Users/admin/.bash_profile /Users/runner/.zprofile /Users/runner/.zshrc /etc/paths.d/nixmac /etc/nix/nix.conf; do
            if [ -e "$path" ]; then
              targets="$targets $path"
            fi
          done
          if [ -z "$targets" ]; then
            echo "no scan targets" >&2
            exit 2
          fi
          set +e
          grep -rIloE -e '-----BEGIN (RSA |EC |OPENSSH |AGE )?PRIVATE KEY-----|SOPS_AGE_KEY=|gh[opsur]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|CACHIX_AUTH_TOKEN=|DARKMATTER_CACHIX_AUTH_TOKEN=|DEVELOPER_ID_APPLICATION=|TAURI_SIGNING_PRIVATE_KEY=' $targets
          status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          exit 0
          SCAN
          if ! env SSH_PASSWORD=admin bash ops/images/ssh-vm.sh "admin@$TART_IP" \
            'cat > /tmp/scan-vm.sh && chmod 700 /tmp/scan-vm.sh' < /tmp/scan-vm.sh; then
            echo "::error::Could not upload secret scanner"
            exit 1
          fi
          if ! FOUND=$(env SSH_PASSWORD=admin bash ops/images/ssh-vm.sh "admin@$TART_IP" \
            '/bin/bash /tmp/scan-vm.sh'); then
            echo "::error::Secret scanner failed (grep error, permission error, or I/O error); refusing to push"
            exit 1
          fi
          if [ -n "$FOUND" ]; then
            echo "::error::Secret patterns found in provisioning-owned paths:"
            echo "$FOUND"
            exit 1
          fi
          echo "No secret patterns found in provisioning-owned paths."
          echo "::endgroup::"

      - name: Stop scan VM
        if: always()
        shell: bash
        run: |
          tart stop nixmac-runner-tahoe 2>/dev/null || true
          pkill -f "tart run.*nixmac-runner-tahoe" 2>/dev/null || true

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | tart login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push candidate image
        id: push
        shell: bash
        env:
          XCODE_ARTIFACT_SHA256: ${{ steps.xcode-artifact.outputs.sha256 }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$IMAGE_NAME"
          TAG="$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          tart push nixmac-runner-tahoe \
            "$IMAGE:$TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.darkmatter.nixmac.xcode-artifact-sha256=$XCODE_ARTIFACT_SHA256"

          DIGEST="$(oras manifest fetch --descriptor "$IMAGE:$TAG" | jq -r '.digest // empty')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Registry returned an invalid manifest digest: $DIGEST"
            exit 1
          fi

          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Pull and boot published image by digest
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          VM_NAME="nixmac-runner-registry-qualification"
          VM_PID=""
          cleanup() {
            tart stop "$VM_NAME" 2>/dev/null || true
            if [ -n "$VM_PID" ]; then
              kill "$VM_PID" 2>/dev/null || true
              wait "$VM_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          tart delete "$VM_NAME" 2>/dev/null || true
          tart clone "$PUBLISHED_IMAGE" "$VM_NAME"
          tart run --no-graphics "$VM_NAME" &>/tmp/tart-registry-qualification.log &
          VM_PID=$!

          VM_IP=""
          for _ in $(seq 1 60); do
            VM_IP=$(tart ip "$VM_NAME" 2>/dev/null || true)
            if [ -n "$VM_IP" ]; then break; fi
            sleep 5
          done
          if [ -z "$VM_IP" ]; then
            echo "::error::Published image did not obtain an IP"
            exit 1
          fi

          for _ in $(seq 1 30); do
            if env SSH_PASSWORD=admin bash ops/images/ssh-vm.sh "admin@$VM_IP" true 2>/dev/null; then
              break
            fi
            sleep 5
          done
          cat > /tmp/qualify-published-vm.sh <<'QUALIFY'
          #!/bin/bash
          set -euo pipefail
          test -x /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild
          test -x /opt/homebrew/bin/tart-guest-agent
          test -f /Library/LaunchDaemons/org.cirruslabs.tart-guest-daemon.plist
          test -f /Library/LaunchAgents/org.cirruslabs.tart-guest-agent.plist
          grep -Fx 'MACs hmac-sha2-256,hmac-sha2-512' \
            /etc/ssh/sshd_config.d/99-cilicon-compat.conf
          version="$(xcodebuild -version | sed -n '1p')"
          case "$version" in
            "Xcode 26"*) ;;
            *)
              echo "unexpected $version" >&2
              exit 1
              ;;
          esac
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          QUALIFY
          if ! env SSH_PASSWORD=admin bash ops/images/ssh-vm.sh "admin@$VM_IP" \
            '/bin/bash -s' < /tmp/qualify-published-vm.sh; then
            echo "::error::Published image failed its digest-qualified boot proof"
            exit 1
          fi

      - name: Promote qualified image
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.push.outputs.image }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAME"
          oras tag "$PUBLISHED_IMAGE" tahoe
          promoted_digest="$(
            oras manifest fetch --descriptor "$IMAGE:tahoe" |
              jq -r '.digest // empty'
          )"
          if [ "$promoted_digest" != "$PUBLISHED_DIGEST" ]; then
            echo "::error::Stable tag does not resolve to the qualified digest"
            exit 1
          fi

      - name: Initialize E2E Packer layer
        shell: bash
        run: |
          cd ops/images
          packer init nixmac-e2e-runner-tahoe.pkr.hcl

      - name: Build immutable Computer Use E2E layer
        shell: bash
        env:
          QUALIFIED_BASE_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          base_digest="${QUALIFIED_BASE_IMAGE##*@}"
          base_repository="${QUALIFIED_BASE_IMAGE%@*}"
          [[ "$base_repository" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cd ops/images
          packer build \
            -var "source_image=$base_repository" \
            -var "source_image_digest=$base_digest" \
            nixmac-e2e-runner-tahoe.pkr.hcl

      - name: First boot E2E qualification
        shell: bash
        run: |
          bash ops/images/run-e2e-image-qualification.sh \
            nixmac-e2e-runner-tahoe \
            "first boot"

      - name: E2E secret scan (pre-push gate)
        shell: bash
        run: |
          set -euo pipefail
          VM_NAME="nixmac-e2e-runner-tahoe"
          VM_PID=""
          cleanup() {
            tart stop "$VM_NAME" 2>/dev/null || true
            if [ -n "$VM_PID" ]; then
              kill "$VM_PID" 2>/dev/null || true
              wait "$VM_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          tart run --no-graphics "$VM_NAME" >/tmp/tart-e2e-secret-scan.log 2>&1 &
          VM_PID=$!
          VM_IP=""
          for _ in $(seq 1 90); do
            VM_IP="$(tart ip "$VM_NAME" 2>/dev/null || true)"
            if [ -n "$VM_IP" ]; then break; fi
            kill -0 "$VM_PID" 2>/dev/null
            sleep 5
          done
          [ -n "$VM_IP" ]
          for _ in $(seq 1 60); do
            if env SSH_PASSWORD=nixmac-e2e-local-only bash ops/images/ssh-vm.sh \
              "nixmac_e2e@$VM_IP" true 2>/dev/null; then
              break
            fi
            sleep 5
          done
          cat > /tmp/scan-e2e-vm.sh <<'SCAN'
          #!/bin/bash
          set -euo pipefail
          targets=(
            "/Users/nixmac_e2e/.zprofile"
            "/Users/nixmac_e2e/.zshrc"
            "/Users/nixmac_e2e/.bash_profile"
            "/var/db/nixmac-e2e"
            "/usr/local/libexec/qualify-nixmac-e2e-runner"
          )
          existing=()
          for target in "${targets[@]}"; do
            if [ -e "$target" ]; then existing+=("$target"); fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "no E2E provisioning paths were available to scan" >&2
            exit 2
          fi
          set +e
          found="$(
            grep -rIloE \
              -e '-----BEGIN (RSA |EC |OPENSSH |AGE )?PRIVATE KEY-----|SOPS_AGE_KEY=|gh[opsur]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|CACHIX_AUTH_TOKEN=|DEVELOPER_ID_APPLICATION=|TAURI_SIGNING_PRIVATE_KEY=' \
              "${existing[@]}"
          )"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          if [ -n "$found" ]; then
            echo "$found"
            exit 3
          fi
          SCAN
          env SSH_PASSWORD=nixmac-e2e-local-only bash ops/images/ssh-vm.sh \
            "nixmac_e2e@$VM_IP" \
            'cat > /tmp/scan-e2e-vm.sh && chmod 700 /tmp/scan-e2e-vm.sh' \
            < /tmp/scan-e2e-vm.sh
          if ! env SSH_PASSWORD=nixmac-e2e-local-only bash ops/images/ssh-vm.sh \
            "nixmac_e2e@$VM_IP" \
            '/bin/bash /tmp/scan-e2e-vm.sh'; then
            echo "::error::E2E secret scan failed; refusing registry push"
            exit 1
          fi

      - name: Require unused or private E2E package namespace
        shell: bash
        run: |
          set -euo pipefail
          repository="$E2E_IMAGE_NAME"
          token_response="$RUNNER_TEMP/nixmac-e2e-anonymous-token.json"
          token_status="$(
            curl --silent --show-error --location --retry 3 \
              --proto '=https' --tlsv1.2 \
              --get --data-urlencode "scope=repository:${repository}:pull" \
              -o "$token_response" \
              -w '%{http_code}' \
              "https://ghcr.io/token"
          )"
          case "$token_status" in
            401|403|404)
              echo "E2E package namespace is unused or denies anonymous reads."
              exit 0
              ;;
            200) ;;
            *)
              echo "::error::Could not test anonymous E2E registry access (token HTTP $token_status)"
              cat "$token_response" >&2
              exit 1
              ;;
          esac
          anonymous_token="$(
            /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' \
              < "$token_response"
          )"
          test -n "$anonymous_token"
          response="$RUNNER_TEMP/nixmac-e2e-anonymous-tags.json"
          manifest_status="$(
            curl --silent --show-error --location --retry 3 \
              --proto '=https' --tlsv1.2 \
              -H "Authorization: Bearer $anonymous_token" \
              -H 'Accept: application/json' \
              -o "$response" \
              -w '%{http_code}' \
              "https://ghcr.io/v2/${repository}/tags/list?n=1"
          )"
          case "$manifest_status" in
            401|403|404)
              echo "E2E package namespace is unused or denies anonymous reads."
              ;;
            200)
              echo "::error::Existing E2E package namespace permits anonymous reads; refusing to publish"
              exit 1
              ;;
            *)
              echo "::error::Could not prove E2E package namespace privacy (HTTP $manifest_status)"
              cat "$response" >&2
              exit 1
              ;;
          esac

      - name: Push E2E candidate image
        id: push-e2e
        shell: bash
        env:
          QUALIFIED_BASE_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$E2E_IMAGE_NAME"
          tag="$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          tart push nixmac-e2e-runner-tahoe \
            "$image:$tag" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$built_at" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.darkmatter.nixmac.base-image=$QUALIFIED_BASE_IMAGE" \
            --label "io.darkmatter.nixmac.cua-driver-version=0.12.6"
          digest="$(oras manifest fetch --descriptor "$image:$tag" | jq -r '.digest // empty')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "image=$image@$digest"
            echo "digest=$digest"
            echo "built_at=$built_at"
          } >> "$GITHUB_OUTPUT"

      - name: Prove published E2E digest denies anonymous reads
        shell: bash
        env:
          E2E_PUBLISHED_DIGEST: ${{ steps.push-e2e.outputs.digest }}
        run: |
          set -euo pipefail
          repository="$E2E_IMAGE_NAME"
          token_response="$RUNNER_TEMP/nixmac-e2e-anonymous-token-after-push.json"
          token_status="$(
            curl --silent --show-error --location --retry 3 \
              --proto '=https' --tlsv1.2 \
              --get --data-urlencode "scope=repository:${repository}:pull" \
              -o "$token_response" \
              -w '%{http_code}' \
              "https://ghcr.io/token"
          )"
          case "$token_status" in
            401|403|404)
              echo "Published E2E digest denies anonymous reads."
              exit 0
              ;;
            200) ;;
            *)
              echo "::error::Could not test published E2E registry access (token HTTP $token_status)"
              cat "$token_response" >&2
              exit 1
              ;;
          esac
          anonymous_token="$(
            /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' \
              < "$token_response"
          )"
          test -n "$anonymous_token"
          response="$RUNNER_TEMP/nixmac-e2e-anonymous-manifest.json"
          manifest_status="$(
            curl --silent --show-error --location --retry 3 \
              --proto '=https' --tlsv1.2 \
              -H "Authorization: Bearer $anonymous_token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              -o "$response" \
              -w '%{http_code}' \
              "https://ghcr.io/v2/${repository}/manifests/${E2E_PUBLISHED_DIGEST}"
          )"
          case "$manifest_status" in
            401|403|404)
              echo "Published E2E digest denies anonymous reads."
              ;;
            200)
              echo "::error::Published E2E digest permits anonymous reads"
              exit 1
              ;;
            *)
              echo "::error::Could not prove published E2E digest privacy (HTTP $manifest_status)"
              cat "$response" >&2
              exit 1
              ;;
          esac

      - name: Pull private E2E image by immutable digest
        shell: bash
        env:
          E2E_PUBLISHED_IMAGE: ${{ steps.push-e2e.outputs.image }}
        run: |
          set -euo pipefail
          tart delete nixmac-e2e-runner-aged-qualification 2>/dev/null || true
          tart clone "$E2E_PUBLISHED_IMAGE" nixmac-e2e-runner-aged-qualification

      - name: Wait before second cold boot
        shell: bash
        run: |
          set -euo pipefail
          # Exercise persistence across a cold, non-immediate second boot.
          sleep 900

      - name: Second cold boot E2E qualification
        shell: bash
        run: |
          bash ops/images/run-e2e-image-qualification.sh \
            nixmac-e2e-runner-aged-qualification \
            "second cold boot"

      - name: Promote qualified E2E image
        shell: bash
        env:
          E2E_PUBLISHED_IMAGE: ${{ steps.push-e2e.outputs.image }}
          E2E_PUBLISHED_DIGEST: ${{ steps.push-e2e.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$E2E_IMAGE_NAME"
          oras tag "$E2E_PUBLISHED_IMAGE" tahoe
          promoted_digest="$(
            oras manifest fetch --descriptor "$image:tahoe" |
              jq -r '.digest // empty'
          )"
          if [ "$promoted_digest" != "$E2E_PUBLISHED_DIGEST" ]; then
            echo "::error::E2E stable tag does not resolve to the qualified digest"
            exit 1
          fi

      - name: Clean up registry qualification VM
        if: always()
        shell: bash
        run: |
          tart stop nixmac-runner-registry-qualification 2>/dev/null || true
          tart delete nixmac-runner-registry-qualification 2>/dev/null || true

      - name: Clean up local VM
        if: always()
        shell: bash
        run: |
          tart delete nixmac-runner-tahoe 2>/dev/null || true
          tart delete nixmac-e2e-runner-tahoe 2>/dev/null || true
          tart delete nixmac-e2e-runner-aged-qualification 2>/dev/null || true

      - name: Summary
        shell: bash
        run: |
          {
            echo "## macOS CI Image Published"
            echo ""
            echo "**Image:** \`${{ steps.push.outputs.image }}\`"
            echo "**Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo "**Xcode artifact:** \`${{ inputs.xcode_artifact_type }}\`"
            echo "**Xcode artifact SHA-256:** \`${{ steps.xcode-artifact.outputs.sha256 }}\`"
            echo "**Base:** \`ghcr.io/cirruslabs/macos-tahoe-base@$BASE_IMAGE_DIGEST\`"
            echo "**E2E image:** \`${{ steps.push-e2e.outputs.image }}\`"
            echo "**E2E digest:** \`${{ steps.push-e2e.outputs.digest }}\`"
            echo "**E2E built at:** \`${{ steps.push-e2e.outputs.built_at }}\`"
            echo "**E2E qualification:** first boot + second cold boot, app-owned TCC smoke"
          } >> "$GITHUB_STEP_SUMMARY"
