name: macOS CI Image

# =============================================================================
# Builds and publishes the nixmac macOS CI tart image to GHCR.
#
# The image pre-bakes Nix, Cachix config, SOPS/age, Bun, Node, and treefmt on
# top of macos-tahoe-xcode:26.5 (transitively vanilla-Tahoe-based) so macOS
# build jobs skip ~5-10 min of per-run toolchain installs.
#
# NOT baked in (repo/lockfile-dependent): devenv profile, Rust toolchain,
# node_modules, Cargo cache. These are built per job, same as the Linux CI
# image (.github/ci-image/Dockerfile).
#
#
 # Base reference is pinned by digest in ops/images/nixmac-runner-tahoe.pkr.hcl;
 # this workflow does not resolve floating image tags at build time.
# Triggers:
#   - Manual dispatch only until a dedicated image-builder host is online.
#   - After a prepared host with verified capacity carries the
#     `nixmac-image-builder` label, re-enable push/schedule triggers.
#
# SECURITY: The Packer template uses public inputs only (no secrets). A
# secret-scan step runs before push and fails the build if any known secret
# pattern is found in the exported image.
# =============================================================================

on:
  workflow_dispatch:

# Re-enable after the image-builder host is prepared:
# on:
#   push:
#     branches: [main]
#     paths:
#       - ops/images/**
#       - .github/workflows/macos-ci-image.yaml
#       - nix/**
#       - devenv.nix
#       - flake.nix
#       - flake.lock
#       - treefmt.nix
#       - package.json
#       - bun.lock
#   schedule:
#     - cron: "0 10 * * 0"
#   workflow_dispatch:

concurrency:
  group: macos-ci-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nixmac-runner

jobs:
  build:
    name: Build and push macOS CI image
    # Must run on a self-hosted mac with tart + packer installed.
    # Uses the nixmac-mac label (same fleet as the build job) but does not
    # compete with builds: this runs on schedule/manual only, not on PRs.
    runs-on: [self-hosted, macOS, nixmac-image-builder]
    timeout-minutes: 90
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read bun version from package.json
        id: bun-version
        shell: bash
        run: |
          VERSION=$(jq -r '.packageManager // empty' package.json | sed -n 's/^bun@//p')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find bun version in package.json (packageManager field)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Packer (if missing)
        shell: bash
        run: |
          if ! command -v packer &>/dev/null; then
            brew install hashicorp/tap/packer
          fi
          packer version

      - name: Initialize Packer plugins
        shell: bash
        run: |
          cd ops/images
          packer init nixmac-runner-tahoe.pkr.hcl

      - name: Build image
        id: build
        shell: bash
        env:
          BUN_VERSION: ${{ steps.bun-version.outputs.version }}
        run: |
          cd ops/images
          packer build \
            -var "bun_version=$BUN_VERSION" \
            nixmac-runner-tahoe.pkr.hcl

      - name: Secret scan (pre-push gate)
        id: secret-scan
        shell: bash
        run: |
          set -euo pipefail
          # Fail-closed: if we cannot start the VM, get its IP, SSH in, and
          # scan, the image is NOT pushed. The Packer template uses public
          # inputs only, but this gate enforces it — never skip.
          VM_NAME="nixmac-runner-tahoe"

          echo "::group::Starting VM for secret scan"
          # Packer leaves the VM stopped; start it in the background.
          tart run "$VM_NAME" &>/tmp/tart-scan-run.log &
          TART_PID=$!

          # Wait up to 5 min for the VM to get an IP.
          TART_IP=""
          for i in $(seq 1 60); do
            TART_IP=$(tart ip "$VM_NAME" 2>/dev/null || true)
            if [ -n "$TART_IP" ]; then break; fi
            sleep 5
          done

          if [ -z "$TART_IP" ]; then
            echo "::error::Could not get VM IP after 5 min; refusing to push unscanned image"
            kill "$TART_PID" 2>/dev/null || true
            tart stop "$VM_NAME" 2>/dev/null || true
            exit 1
          fi
          echo "VM IP: $TART_IP"

          # Wait for SSH to be available.
          for i in $(seq 1 30); do
            if sshpass -p admin ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "admin@$TART_IP" true 2>/dev/null; then
              break
            fi
            sleep 5
          done

          if ! sshpass -p admin ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "admin@$TART_IP" true 2>/dev/null; then
            echo "::error::SSH to VM failed after 2.5 min; refusing to push unscanned image"
            kill "$TART_PID" 2>/dev/null || true
            tart stop "$VM_NAME" 2>/dev/null || true
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Scanning for secrets"
          # Patterns: private keys, API tokens, age keys, SOPS keys
          PATTERNS='(
            -----BEGIN (RSA |EC |OPENSSH |AGE )?PRIVATE KEY-----
            |SOPS_AGE_KEY=
            |age-encryption\.org
            |ghp_[0-9a-f]{36}
            |gho_[0-9a-f]{36}
            |CACHIX_AUTH_TOKEN=
            |DARKMATTER_CACHIX_AUTH_TOKEN=
            |DEVELOPER_ID_APPLICATION=
            |p12:
          )'

          SCAN_DIRS="/Users/admin /Users/runner /tmp /var/tmp /etc"
          FOUND=$(sshpass -p admin ssh -o StrictHostKeyChecking=no "admin@$TART_IP" \
            "grep -rIlE '$PATTERNS' $SCAN_DIRS 2>/dev/null || true")

          if [ -n "$FOUND" ]; then
            echo "::error::Secret patterns found in image:"
            echo "$FOUND"
            exit 1
          fi
          echo "No secret patterns found."
          echo "::endgroup::"

      - name: Stop scan VM
        if: always()
        shell: bash
        run: |
          tart stop nixmac-runner-tahoe 2>/dev/null || true
          pkill -f "tart run nixmac-runner-tahoe" 2>/dev/null || true

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | tart login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        id: push
        shell: bash
        run: |
          tart push nixmac-runner-tahoe \
            ghcr.io/darkmatter/nixmac-runner:tahoe
          # Also tag with date+sha for traceability
          TAG="$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)"
          tart push nixmac-runner-tahoe \
            ghcr.io/darkmatter/nixmac-runner:$TAG

      - name: Clean up local VM
        if: always()
        shell: bash
        run: |
          tart delete nixmac-runner-tahoe 2>/dev/null || true

      - name: Summary
        shell: bash
        run: |
          {
            echo "## macOS CI Image Published"
            echo ""
            echo "**Image:** \`ghcr.io/darkmatter/nixmac-runner:tahoe\`"
            echo "**Bun version:** \`${{ steps.bun-version.outputs.version }}\`"
            echo "**Base:** \`ghcr.io/cirruslabs/macos-tahoe-xcode:26.5\`"
          } >> "$GITHUB_STEP_SUMMARY"
