name: macOS CI Image

# =============================================================================
# Builds and publishes the nixmac macOS CI tart image to GHCR.
#
 # Builds the minimal nixmac macOS Tart image:
 #   macos-tahoe-base (pinned digest) + one supplied Xcode artifact.
 #
 # Nix, devenv, Bun, Rust, Cargo, and node_modules remain remote/lockfile-keyed
 # caches and are installed by the existing build workflow.
#
#
 # Base reference is pinned by digest in ops/images/nixmac-runner-tahoe.pkr.hcl;
 # this workflow does not resolve floating image tags at build time.
# Triggers:
#   - Manual dispatch only until a dedicated image-builder host is online.
#   - After a prepared host with verified capacity carries the
#     `nixmac-image-builder` label, re-enable push/schedule triggers.
#
# SECURITY: The Packer template uses public inputs only (no secrets). A
# secret-scan step runs before push and fails the build if any known secret
# pattern is found in the exported image.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      xcode_artifact:
        description: "Absolute path to approved Xcode 26.x .xip/.pkg on the builder"
        required: true
        type: string
      xcode_artifact_type:
        description: "Xcode artifact extension"
        required: true
        type: choice
        options: [xip, pkg]
        default: xip
# Re-enable after the image-builder host is prepared:
# on:
#   push:
#     branches: [main]
#     paths:
#       - ops/images/**
#       - .github/workflows/macos-ci-image.yaml
#       - nix/**
#       - devenv.nix
#       - flake.nix
#       - flake.lock
#       - treefmt.nix
#       - package.json
#       - bun.lock
#   schedule:
#     - cron: "0 10 * * 0"
#   workflow_dispatch:

concurrency:
  group: macos-ci-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nixmac-runner

jobs:
  build:
    name: Build and push macOS CI image
    # Dedicated image-builder host only; never use production nixmac-mac
    # runners. The Xcode artifact is supplied at manual dispatch time.
    runs-on: [self-hosted, macOS, nixmac-image-builder]
    timeout-minutes: 90
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Packer (if missing)
        shell: bash
        run: |
          if ! command -v packer &>/dev/null; then
            brew install hashicorp/tap/packer
          fi
          packer version


      - name: Initialize Packer plugins
        shell: bash
        run: |
          cd ops/images
          packer init nixmac-runner-tahoe.pkr.hcl

      - name: Build image
        id: build
        shell: bash
        env:
          XCODE_ARTIFACT: ${{ inputs.xcode_artifact }}
          XCODE_ARTIFACT_TYPE: ${{ inputs.xcode_artifact_type }}
        run: |
          cd ops/images
          test -f "$XCODE_ARTIFACT"
          packer build \
            -var "xcode_artifact=$XCODE_ARTIFACT" \
            -var "xcode_artifact_type=$XCODE_ARTIFACT_TYPE" \
            nixmac-runner-tahoe.pkr.hcl

      - name: Secret scan (pre-push gate)
        id: secret-scan
        shell: bash
        run: |
          set -euo pipefail
          # Fail-closed: if we cannot start the VM, get its IP, SSH in, and
          # scan, the image is NOT pushed. The Packer template uses public
          # inputs only, but this gate enforces it — never skip.
          VM_NAME="nixmac-runner-tahoe"

          echo "::group::Starting VM for secret scan"
          # Packer leaves the VM stopped; start it in the background.
          tart run "$VM_NAME" &>/tmp/tart-scan-run.log &
          TART_PID=$!

          # Wait up to 5 min for the VM to get an IP.
          TART_IP=""
          for i in $(seq 1 60); do
            TART_IP=$(tart ip "$VM_NAME" 2>/dev/null || true)
            if [ -n "$TART_IP" ]; then break; fi
            sleep 5
          done

          if [ -z "$TART_IP" ]; then
            echo "::error::Could not get VM IP after 5 min; refusing to push unscanned image"
            kill "$TART_PID" 2>/dev/null || true
            tart stop "$VM_NAME" 2>/dev/null || true
            exit 1
          fi
          echo "VM IP: $TART_IP"

          # Wait for SSH to be available.
          for i in $(seq 1 30); do
            if sshpass -p admin ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "admin@$TART_IP" true 2>/dev/null; then
              break
            fi
            sleep 5
          done

          if ! sshpass -p admin ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "admin@$TART_IP" true 2>/dev/null; then
            echo "::error::SSH to VM failed after 2.5 min; refusing to push unscanned image"
            kill "$TART_PID" 2>/dev/null || true
            tart stop "$VM_NAME" 2>/dev/null || true
            exit 1
          fi
          echo "::group::Verifying Nix daemon and non-login PATH after VM start"
          if ! sshpass -p admin ssh -o StrictHostKeyChecking=no "admin@$TART_IP" \
            'env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -c "set -eu; for tool in nix nix-daemon cachix sops age node treefmt nixfmt; do test -x /usr/local/bin/$tool; command -v $tool; done; nix store ping --store daemon; cachix --version"'; then
            echo "::error::Nix daemon or runner-visible Nix shims unavailable after VM start; refusing to push image"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Scanning provisioning-owned paths for secrets"
          # Scan only files this recipe can create or modify. Do not recurse
          # through the base image's /etc or /nix: Tahoe's pre-existing SSH
          # material and package documentation are not image-owned secrets.
          # The remote grep status is meaningful: 0 = matches, 1 = no
          # matches, >1 = scanner/permission/I/O error.
          PATTERNS='-----BEGIN (RSA |EC |OPENSSH |AGE )?PRIVATE KEY-----|SOPS_AGE_KEY=|ghp_[0-9a-f]{36}|gho_[0-9a-f]{36}|CACHIX_AUTH_TOKEN=|DARKMATTER_CACHIX_AUTH_TOKEN=|DEVELOPER_ID_APPLICATION=|TAURI_SIGNING_PRIVATE_KEY='

          if ! FOUND=$(sshpass -p admin ssh -o StrictHostKeyChecking=no "admin@$TART_IP" \
            "set -eu
             targets=
             for path in /Users/admin/.zprofile /Users/admin/.zshrc /Users/admin/.bash_profile /Users/admin/.config /Users/runner/.zprofile /Users/runner/.zshrc /Users/runner/.config /etc/paths.d/nixmac /etc/nix/nix.conf; do
               if [ -e \\\"\\$path\\\" ]; then targets=\\\"\\$targets \\$path\\\"; fi
             done
             if [ -z \\\"\\$targets\\\" ]; then echo 'no scan targets' >&2; exit 2; fi
             set +e
             grep -rIloE '$PATTERNS' \\$targets
             status=\\$?
             if [ \\\"\\$status\\\" -gt 1 ]; then exit \\\"\\$status\\\"; fi
             exit 0"); then
            echo "::error::Secret scanner failed (grep error, permission error, or I/O error); refusing to push"
            exit 1
          fi

          if [ -n "$FOUND" ]; then
            echo "::error::Secret patterns found in provisioning-owned paths:"
            echo "$FOUND"
            exit 1
          fi
          echo "No secret patterns found in provisioning-owned paths."
          echo "::endgroup::"

      - name: Stop scan VM
        if: always()
        shell: bash
        run: |
          tart stop nixmac-runner-tahoe 2>/dev/null || true
          pkill -f "tart run nixmac-runner-tahoe" 2>/dev/null || true

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | tart login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        id: push
        shell: bash
        run: |
          tart push nixmac-runner-tahoe \
            ghcr.io/darkmatter/nixmac-runner:tahoe
          # Also tag with date+sha for traceability
          TAG="$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)"
          tart push nixmac-runner-tahoe \
            ghcr.io/darkmatter/nixmac-runner:$TAG

      - name: Clean up local VM
        if: always()
        shell: bash
        run: |
          tart delete nixmac-runner-tahoe 2>/dev/null || true

      - name: Summary
        shell: bash
        run: |
          {
            echo "## macOS CI Image Published"
            echo ""
            echo "**Image:** \`ghcr.io/darkmatter/nixmac-runner:tahoe\`"
            echo "**Xcode artifact:** \`${{ inputs.xcode_artifact_type }}\`"
            echo "**Base:** \`ghcr.io/cirruslabs/macos-tahoe-base@sha256:a8e1c8305758643f513fdccdd829c2243687c60791083dea42f73f0b7aeb435c\`"
          } >> "$GITHUB_STEP_SUMMARY"
