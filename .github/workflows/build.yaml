name: Build macOS App
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Desktop build {0} {1}', inputs.source_ref || github.sha, inputs.request_id || github.run_id) || format('Build macOS App ({0})', github.ref_name) }}
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact lowercase commit SHA to build (defaults to the workflow revision)
        required: false
        type: string
      request_id:
        description: Desktop build request identifier
        required: false
        type: string

concurrency:
  group: build-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.request_id || github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
jobs:
  source:
    name: Admit source revision
    runs-on: arc
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate exact build request
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ( -n "$SOURCE_REF" || -n "$REQUEST_ID" ) && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Exact desktop build requests must use the default branch workflow" >&2
            exit 1
          fi
          source_sha="${SOURCE_REF:-$GITHUB_SHA}"
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ -n "$REQUEST_ID" ]] && ! [[ "$REQUEST_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "request_id must be 1-128 letters, digits, dots, underscores or hyphens" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  # Run the repo's git-hooks (treefmt, shellcheck) across the whole tree so a
  # commit made with hooks skipped/broken still gets flagged. Its failure
  # shows up as a red check on the PR without blocking rust-tests/build.
  git-hooks:
    name: Git Hooks
    needs: source
    runs-on: arc
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Verify checked-out source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Setup Nix and caches
        uses: ./.github/actions/setup-nix
        with:
          darkmatter-cachix-auth-token: ${{ secrets.DARKMATTER_CACHIX_AUTH_TOKEN }}

      # Pinned to match .github/actions/setup-devenv. The devenv CLI is needed
      # here (not just the cached profile): entering the shell is what
      # materializes the .pre-commit-config.yaml symlink that prek reads.
      - name: Install devenv
        run: nix build github:cachix/devenv/v2.1.2 --out-link "$RUNNER_TEMP/devenv-cli"

      - name: Run git hooks on all files
        env:
          NIXPKGS_ALLOW_UNFREE: 1
        run: |
          "$RUNNER_TEMP/devenv-cli/bin/devenv" shell --impure -- \
            prek run --all-files --show-diff-on-failure

  rust-tests:
    name: Rust Tests (Linux)
    needs: source
    runs-on: arc
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Record checked-out source
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri

      - name: Patch passkey Swift package
        working-directory: apps/native/src-tauri
        run: |
          cargo fetch --locked
          bash "$GITHUB_WORKSPACE/ops/scripts/ci/patch-passkey-swift.sh"

      - name: Rust unit tests
        working-directory: apps/native
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          NIXMAC_ENV: production
          # Packaged builds hard-fail without the packaged source revision
          # (build.rs embeds it as the build identity).
          NIXMAC_BUILD_ID: ${{ steps.source.outputs.sha }}
  build:
    needs: [source, rust-tests]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: false

      - name: Clean workspace while preserving CI caches
        shell: bash
        run: |
          git reset --hard
          git clean -ffdx -e .devenv/ -e .devenv-ci/

      - name: Record checked-out source
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Nix and caches
        uses: ./.github/actions/setup-nix
        with:
          darkmatter-cachix-auth-token: ${{ secrets.DARKMATTER_CACHIX_AUTH_TOKEN }}

      - name: Setup devenv profile
        uses: ./.github/actions/setup-devenv
        with:
          darkmatter-cachix-auth-token: ${{ secrets.DARKMATTER_CACHIX_AUTH_TOKEN }}

      # Release-script tests (signing, install-name normalization, DMG
      # portability). Nothing else executes these test harnesses, so without
      # this step a stale or broken test goes unnoticed while the scripts it
      # guards keep changing. Runs before the expensive build steps.
      #
      # Runs with the devenv profile prepended to PATH (setup-devenv above) —
      # the same environment as the release normalize/sign steps below, GNU
      # coreutils shadowing included. Reproduce locally with:
      #   devenv shell -- bash ops/scripts/release/<name>.test.sh
      - name: Release script tests
        shell: bash
        run: |
          set -euo pipefail
          for test in ops/scripts/release/*.test.sh; do
            echo "==> $test"
            bash "$test"
          done

      - name: Setup Xcode Swift toolchain
        uses: ./.github/actions/setup-xcode

      # Rust (pinned stable rustc/cargo) comes from the devenv profile above.
      # Do NOT add dtolnay/rust-toolchain here: it installs rustup into the
      # runner's persistent ~/.cargo, and a broken rustup there took down the
      # merge queue ("cannot execute binary file").

      - name: Install frontend dependencies
        run: bun install

      # tauri-plugin-macos-passkey 0.1.0 ships a Swift package declaring
      # swift-tools-version 6.1, but the self-hosted runner has Swift 6.0.2
      # (Xcode 16.1). Fetch crates and lower the declared tools version before
      # syncing the app version: sync-version mutates Cargo.toml, which would
      # make `cargo fetch --locked` fail because Cargo.lock still contains the
      # committed package version.
      - name: Patch passkey Swift package
        working-directory: apps/native/src-tauri
        run: |
          cargo fetch --locked
          bash "$GITHUB_WORKSPACE/ops/scripts/ci/patch-passkey-swift.sh"

      # Lint before the expensive release build. Runs here (not in a Linux
      # job) because this runner already has the full devenv toolchain and
      # macOS SDK, and clippy on macOS covers the cfg(target_os = "macos")
      # code that actually ships. Placed before the sccache setup: sccache as
      # RUSTC_WRAPPER does not reliably cache clippy-driver invocations.
      # nixmac/codegen keeps the feature-gated codegen paths (gen-schemas,
      # gen-orpc, gen-docs-index, specta_gen_ts) covered by the lint even
      # though release builds exclude them.
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --features nixmac/codegen -- -D warnings
        env:
          NIXMAC_ENV: production
          # Packaged builds hard-fail without the packaged source revision.
          NIXMAC_BUILD_ID: ${{ steps.source.outputs.sha }}

      # Same test set as the Linux `rust-tests` job, run again here because a
      # large share of this crate's behavioral coverage is
      # `cfg(target_os = "macos")` and compiles away to nothing on Linux — the
      # privileged helper's socket serving, peer authentication, and launchd
      # paths among it. Without this step CI can be green while none of it has
      # ever executed.
      #
      # Placed with clippy: after the toolchain and passkey patch are in place,
      # before the sccache setup and the expensive release build, so a failure
      # is fast and cheap. `NIXMAC_ENV`/`NIXMAC_BUILD_ID` match the clippy and
      # build steps — build.rs reruns on those, so a different value here would
      # force a rebuild of everything that follows.
      - name: Rust unit tests (macOS)
        run: cargo test -p nixmac
        env:
          NIXMAC_ENV: production
          NIXMAC_BUILD_ID: ${{ steps.source.outputs.sha }}

      # Decide what kind of build this is:
      #   - tag:     push of refs/tags/v* → ship that exact version on stable
      #   - develop: push to main → ship on the develop channel
      #   - branch:  PR / feature branch / workflow_dispatch → build-only
      #
      # Tags are the source of truth for shipped (stable) versions. Pushes to
      # main land on the develop channel; the stable channel only updates when
      # a release is created in GitHub (which pushes a v* tag).
      - name: Compute release version
        id: release-version
        run: |
          # Older source commits may still classify a manual tag as a release.
          # The trusted workflow keeps every dispatch build-only.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'mode=branch\nversion=\ntag=\n' >> "$GITHUB_OUTPUT"
          else
            bash ops/scripts/release/compute-version.sh
          fi

      - name: Setup sccache
        shell: bash
        run: |
          if ! command -v sccache &>/dev/null; then
            brew install sccache 2>/dev/null || cargo install sccache 2>/dev/null || true
          fi
          # cargo install lands in ~/.cargo/bin, which is not on PATH (rustup
          # is intentionally absent); resolve an absolute path for RUSTC_WRAPPER.
          SCCACHE_BIN="$(command -v sccache || true)"
          if [ -z "$SCCACHE_BIN" ] && [ -x "$HOME/.cargo/bin/sccache" ]; then
            SCCACHE_BIN="$HOME/.cargo/bin/sccache"
          fi
          mkdir -p "$RUNNER_TEMP/sccache"
          if [ -n "$SCCACHE_BIN" ]; then
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=$SCCACHE_BIN" >> "$GITHUB_ENV"
          else
            echo "::notice::sccache unavailable; building without a compiler cache."
          fi

      - name: Restore sccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-
      # Sync native app version files. Tag + develop modes use the computed
      # version directly; branch/PR builds fall back to the max(package.json,
      # latest-git-tag) guard so a stale package.json cannot embed a version
      # lower than what has already shipped (which would trigger a
      # false-positive update banner, e.g. embedding 0.5.0 when latest.json is
      # 0.16.2).
      - name: Sync native app version
        id: sync-version
        env:
          RELEASE_MODE: ${{ steps.release-version.outputs.mode }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          NIXMAC_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        # The legacy script uses GITHUB_SHA for the version suffix. Override
        # only that child process so old source revisions receive the right SHA.
        run: env GITHUB_SHA="$NIXMAC_SOURCE_SHA" bash ops/scripts/release/sync-version.sh
      - name: Check for code signing secrets
        id: check-secrets
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "has_certificate=true" >> $GITHUB_OUTPUT
          else
            echo "has_certificate=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "has_notarization=true" >> $GITHUB_OUTPUT
          else
            echo "has_notarization=false" >> $GITHUB_OUTPUT
          fi
      # Build the Tauri app (TAURI_SIGNING_PRIVATE_KEY + PASSWORD come from sops)
      # NOTE: Certificate import is intentionally deferred until after this step.
      # Running `security list-keychain -d user -s <keychain>` before the build
      # replaces the keychain search list and breaks DMG bundling on tag runs.
      - name: Build Tauri app
        run: |
          # unset the certificate and password so the runner can't influence the build
          export APPLE_SIGNING_IDENTITY="-"
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD
          bun run desktop:build
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass DSNs and build metadata into the tauri action step so build.rs can read them
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NIXMAC_ENV: production
          # Build identity compiled into the GUI, helper, and sync agent; the
          # sidecar build inherits it through the environment.
          NIXMAC_BUILD_ID: ${{ steps.source.outputs.sha }}
          NIXMAC_VERSION: ${{ steps.sync-version.outputs.build_version }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          SUBMITTED_FEEDBACK_DSN: ${{ secrets.SUBMITTED_FEEDBACK_DSN }}

      # An unset NIXMAC_ENV selects the development profile, which turns the
      # permissions gate off. Check the artifacts themselves name production,
      # rather than trusting that the env above reached both bakers: the
      # frontend bundle carries its profile as a Vite define, the binary as a
      # build.rs embed, and they are baked by separate code paths.
      #
      # esbuild may drop the quotes on the object key, so both greps accept the
      # key quoted or bare. The second one is the important half: a release
      # bundle that carries a non-production profile at all has a path back to
      # one, whether or not it also carries the right one.
      - name: Verify artifacts carry the production profile
        run: |
          set -euo pipefail

          if [ ! -d apps/native/dist ]; then
            echo "ERROR: apps/native/dist is missing; the frontend was not built"
            exit 1
          fi
          if ! grep -rqE '"?NIXMAC_ENV"?:"production"' apps/native/dist; then
            echo "ERROR: frontend bundle in apps/native/dist does not carry the production profile"
            exit 1
          fi
          if grep -rqE '"?NIXMAC_ENV"?:"(development|e2e)"' apps/native/dist; then
            echo "ERROR: frontend bundle in apps/native/dist also carries a non-production profile"
            grep -rhoE '"?NIXMAC_ENV"?:"(development|e2e)"' apps/native/dist | sort -u
            exit 1
          fi

          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | sed -n '1p' || true)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app bundle found under target/release/bundle/macos"
            exit 1
          fi
          if ! grep -qa '"NIXMAC_ENV":"production"' "$APP_PATH/Contents/MacOS/nixmac"; then
            echo "ERROR: $APP_PATH does not embed the production profile"
            exit 1
          fi

      - name: Unit Test frontend
        working-directory: apps/native
        run: bun run test:unit

      - name: Save sccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # Import Apple Developer certificate (only for releases with secrets).
      # Placed AFTER the Tauri build to avoid replacing the keychain search list
      # before `bun run desktop:build`, which caused DMG bundling failures on tags.
      # The normalizer needs this keychain to re-sign updater archives after
      # install-name rewrites mutate the embedded app bundle.
      - name: Import Apple Developer certificate
        if: steps.check-secrets.outputs.has_certificate == 'true'
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: bash ops/scripts/release/import-certificate.sh
      - name: Normalize macOS system install names
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: |
          set -euo pipefail

          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | sed -n '1p' || true)
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | sed -n '1p' || true)
          TAR_GZ_PATH=$(find target/release/bundle -name "*.app.tar.gz" -not -name "*.sig" -type f 2>/dev/null | sed -n '1p' || true)

          if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ] || [ -z "$TAR_GZ_PATH" ]; then
            echo "ERROR: missing app, DMG, or updater archive for install-name normalization (APP_PATH=$APP_PATH DMG_PATH=$DMG_PATH TAR_GZ_PATH=$TAR_GZ_PATH)"
            exit 1
          fi

          bash ops/scripts/release/normalize-macos-install-names.sh "$APP_PATH" "$DMG_PATH" "$TAR_GZ_PATH"

      # Sign the app bundle (required for notarization)
      - name: Sign app bundle
        run: bash ops/scripts/release/sign-app.sh
      # Install deterministic Finder metadata into the DMG. Tauri copies
      # .background/dmg-background.png, but our CI hosts do not reliably emit
      # root .DS_Store; without it Finder opens a plain white installer window.
      # The script mount-verifies .DS_Store, .background, Applications link,
      # and the signed app before notarization/upload.
      - name: Install DMG Finder layout metadata
        if: steps.check-secrets.outputs.has_certificate == 'true'
        run: |
          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | sed -n '1p' || true)
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | sed -n '1p' || true)
          bash ops/scripts/release/rebuild-dmg-with-layout.sh "$APP_PATH" "$DMG_PATH"
      # Notarize the app (requires Apple Developer account)
      - name: Notarize app
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: bash ops/scripts/release/notarize.sh
      - name: Check macOS app portability
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | sed -n '1p' || true)
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | sed -n '1p' || true)
          TAR_GZ_PATH=$(find target/release/bundle -name "*.app.tar.gz" -not -name "*.sig" -type f 2>/dev/null | sed -n '1p' || true)

          if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ] || [ -z "$TAR_GZ_PATH" ]; then
            echo "ERROR: missing app, DMG, or updater archive for portability check (APP_PATH=$APP_PATH DMG_PATH=$DMG_PATH TAR_GZ_PATH=$TAR_GZ_PATH)"
            exit 1
          fi

          bash ops/scripts/release/check-portable-macos-app.sh "$APP_PATH" "$DMG_PATH" "$TAR_GZ_PATH"
      - name: Get artifact paths
        id: artifacts
        run: |
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | head -1 || echo "")
          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | head -1 || echo "")

          {
            echo "dmg_path=$DMG_PATH"
            echo "app_path=$APP_PATH"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$DMG_PATH" ]; then
            echo "dmg_name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"
          fi
      - name: Write exact build provenance
        shell: python3 {0}
        env:
          NIXMAC_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          NIXMAC_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import subprocess

          source_sha = os.environ["NIXMAC_SOURCE_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise ValueError("Build provenance requires an exact source SHA")
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual_sha != source_sha:
              raise ValueError("Source checkout changed during the build")
          apps = list(Path("target/release/bundle/macos").glob("*.app"))
          dmgs = list(Path("target/release/bundle/dmg").glob("*.dmg"))
          if len(apps) != 1 or len(dmgs) != 1 or not dmgs[0].is_file() or dmgs[0].is_symlink():
              raise ValueError("Expected exactly one application bundle and one regular DMG")
          with (apps[0] / "Contents/Info.plist").open("rb") as stream:
              bundle = plistlib.load(stream)
          if bundle.get("CFBundleIdentifier") != "com.darkmatter.nixmac" or bundle.get("NixmacBuildId") != source_sha:
              raise ValueError("Built application identity does not match the requested source")
          executable = bundle.get("CFBundleExecutable", "")
          if not executable or Path(executable).name != executable:
              raise ValueError("Invalid application executable name")
          architectures = sorted(set(subprocess.check_output([
              "/usr/bin/lipo", "-archs", str(apps[0] / "Contents/MacOS" / executable),
          ], text=True).split()))
          if architectures != ["arm64"]:
              raise ValueError("Desktop build requires an ARM64 application")
          digest = hashlib.sha256()
          with dmgs[0].open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          size = dmgs[0].stat().st_size
          if size <= 0:
              raise ValueError("Built DMG is empty")
          provenance = {
              "schemaVersion": "nixmac.desktop-build.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sourceSha": source_sha,
              "requestId": os.environ.get("NIXMAC_REQUEST_ID") or None,
              "event": os.environ["GITHUB_EVENT_NAME"],
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "workflowSha": os.environ["GITHUB_WORKFLOW_SHA"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "architectures": architectures,
              "bundleIdentifier": bundle["CFBundleIdentifier"],
              "bundleVersion": bundle["CFBundleShortVersionString"],
              "bundleBuildId": bundle["NixmacBuildId"],
              "dmg": {"fileName": dmgs[0].name, "bytes": size, "sha256": digest.hexdigest()},
          }
          output = dmgs[0].parent / "nixmac-build-provenance.json"
          output.write_text(json.dumps(provenance, indent=2) + "\n")
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixmac-macos-dmg
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/nixmac-build-provenance.json
          if-no-files-found: error
      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixmac-macos-app
          path: target/release/bundle/macos/*.app
          if-no-files-found: warn
          include-hidden-files: true
      # Create GitHub Release for tag pushes only. The stable channel only
      # updates when a release is created in GitHub (via a pushed v* tag);
      # main pushes land on the develop channel. Skipped for test tags
      # matching `-test.N` so we can exercise the full signing/notarization +
      # DMG swap path on a disposable tag without publishing a public release.
      - name: Create Release
        if: github.event_name == 'push' && steps.release-version.outputs.mode == 'tag' &&
          !contains(steps.release-version.outputs.tag, '-test.')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          tag_name: ${{ steps.release-version.outputs.tag }}
          files: |
            target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Upload to R2 for auto-updater (R2 creds come from sops).
      # tag → stable channel; develop (main push) → develop channel.
      # Skipped for test tags matching `-test.N` so we can exercise the full
      # signing/notarization + DMG swap path on a disposable tag without
      # overwriting latest.json on the updater CDN.
      - name: Upload to R2
        if: github.event_name == 'push' && (steps.release-version.outputs.mode == 'tag' ||
          steps.release-version.outputs.mode == 'develop') &&
          !contains(steps.release-version.outputs.tag, '-test.')
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        env:
          AWS_DEFAULT_REGION: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          UPDATE_CHANNEL: ${{ steps.release-version.outputs.mode == 'develop' && 'develop' || 'stable' }}
        run: bash ops/scripts/release/upload-r2.sh
      # Sync the shipped release to Linear so issues referenced in commits since
      # the previous release get linked. Runs only after R2 upload succeeds, so
      # Linear releases track what actually shipped. Skipped for `-test.N` tags
      # to match the GitHub Release / R2 upload skip.
      - name: Sync release to Linear
        if: github.event_name == 'push' && steps.release-version.outputs.mode == 'tag' &&
          !contains(steps.release-version.outputs.tag, '-test.')
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ steps.release-version.outputs.version }}
          name: nixmac v${{ steps.release-version.outputs.version }}
      - name: Cleanup keychain
        if: always()
        run: bash ops/scripts/release/cleanup-keychain.sh
