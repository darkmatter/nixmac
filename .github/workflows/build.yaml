name: Build macOS App
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_backfill:
        description: Resolve or build the exact merged SHA for Computer Use E2E
        required: false
        type: boolean
        default: false
      e2e_merge_sha:
        description: Exact lowercase merged SHA; dispatch the deterministic backfill branch pointing at this SHA
        required: false
        type: string
        default: ""
      runner_pool:
        description: "Mac runner pool for manual verification"
        type: choice
        options:
          [
            auto,
            self-hosted,
            custom,
            depot,
            image-builder-network-config,
            image-builder-provision,
            image-builder-preflight,
            image-builder,
          ]
        default: auto
        required: true
      xcode_artifact:
        description: "Builder-local Xcode .xip/.pkg path (image-builder only)"
        type: string
        required: false
      xcode_artifact_type:
        description: "Builder-local Xcode artifact type (image-builder only)"
        type: choice
        options: [xip, pkg]
        default: xip
        required: false
      xcode_artifact_sha256:
        description: "Approved Xcode artifact SHA-256 (image-builder only)"
        type: string
        required: false
  merge_group:

concurrency:
  group: build-${{ inputs.e2e_merge_sha || github.event.pull_request.number || github.ref }}-${{ inputs.runner_pool == 'image-builder-network-config' && 'image-network-config' || inputs.runner_pool == 'image-builder-provision' && 'image-provision' || inputs.runner_pool == 'image-builder-preflight' && 'image-preflight' || inputs.runner_pool == 'image-builder' && 'image-build' || 'product' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
jobs:
  # The macOS image workflow is not registered for workflow_dispatch until it
  # exists on the default branch. Route its pre-merge qualification through
  # this already-registered workflow so PR #604 can prove the image before
  # merge without enabling any scheduled or default-branch consumer.
  image-builder-provision:
    name: Provision macOS image builder
    if: inputs.runner_pool == 'image-builder-provision'
    permissions:
      contents: read
    uses: ./.github/workflows/macos-ci-image-builder-host.yaml
    with:
      mode: provision

  image-builder-network-config:
    name: Configure macOS image-builder networking
    if: inputs.runner_pool == 'image-builder-network-config'
    permissions:
      contents: read
    uses: ./.github/workflows/macos-ci-image-builder-host.yaml
    with:
      mode: configure-network

  image-builder-preflight:
    name: Inspect macOS image builder
    if: inputs.runner_pool == 'image-builder-preflight'
    permissions:
      contents: read
    uses: ./.github/workflows/macos-ci-image-builder-host.yaml
    with:
      mode: preflight

  build-macos-image:
    name: Build and qualify macOS CI image
    if: inputs.runner_pool == 'image-builder'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/macos-ci-image.yaml
    with:
      xcode_artifact: ${{ inputs.xcode_artifact }}
      xcode_artifact_type: ${{ inputs.xcode_artifact_type }}
      xcode_artifact_sha256: ${{ inputs.xcode_artifact_sha256 }}

  # Run the repo's git-hooks (treefmt, shellcheck) across the whole tree so a
  # commit made with hooks skipped/broken still gets flagged. Intentionally
  # not in any `needs` chain: a failure shows up as a red check on the PR but
  # never blocks rust-tests/build from running.
  git-hooks:
    name: Git Hooks
    if: inputs.runner_pool != 'image-builder' && inputs.runner_pool != 'image-builder-preflight' && inputs.runner_pool != 'image-builder-provision' && inputs.runner_pool != 'image-builder-network-config'
    runs-on: arc
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Nix and caches
        uses: ./.github/actions/setup-nix
        with:
          darkmatter-cachix-auth-token: ${{ secrets.DARKMATTER_CACHIX_AUTH_TOKEN }}

      # Pinned to match .github/actions/setup-devenv. The devenv CLI is needed
      # here (not just the cached profile): entering the shell is what
      # materializes the .pre-commit-config.yaml symlink that prek reads.
      - name: Install devenv
        run: nix build github:cachix/devenv/v2.1.2 --out-link /tmp/nixmac-devenv-cli

      - name: Run Computer Use workflow contracts
        env:
          BASH_ENV: ""
          ENV: ""
          NIXPKGS_ALLOW_UNFREE: 1
          NODE_OPTIONS: ""
        shell: /tmp/nixmac-devenv-cli/bin/devenv shell --impure -- bash -euo pipefail {0}
        run: |
          NIXMAC_E2E_PYTHON_PATH="$(command -v python3)"
          NIXMAC_E2E_FFMPEG_PATH="$(command -v ffmpeg)"
          NIXMAC_E2E_FFPROBE_PATH="$(command -v ffprobe)"
          export \
            NIXMAC_E2E_PYTHON_PATH \
            NIXMAC_E2E_FFMPEG_PATH \
            NIXMAC_E2E_FFPROBE_PATH
          node tests/e2e/computer-use/workflow-concurrency-contract-self-test.mjs
          node tests/e2e/computer-use/workflow-contract-self-test.mjs
          node tests/e2e/computer-use/peekaboo-workflow-contract-self-test.mjs
          node tests/e2e/computer-use/centaur-workflow-contract-self-test.mjs
          node tests/e2e/computer-use/cilicon-lifecycle-contract-self-test.mjs
          node tests/e2e/computer-use/cilicon-lifecycle-consumer-self-test.mjs
          node tests/e2e/computer-use/cua-driver-install-contract-self-test.mjs
          node tests/e2e/computer-use/remote-host-lease-contract-self-test.mjs
          node tests/e2e/computer-use/drivers/driver-self-test.mjs
          node tests/e2e/computer-use/verification-contract-self-test.mjs
          node tests/e2e/computer-use/evidence-manifest-self-test.mjs
          node tests/e2e/computer-use/run-cua-driver.mjs self-test
          node tests/e2e/computer-use/run-remote-cua.mjs self-test
          node tests/e2e/computer-use/macos-ci-image-contract-self-test.mjs

      - name: Run git hooks
        env:
          BASH_ENV: ""
          ENV: ""
          NIXPKGS_ALLOW_UNFREE: 1
          NODE_OPTIONS: ""
        shell: /tmp/nixmac-devenv-cli/bin/devenv shell --impure -- bash -euo pipefail {0}
        run: prek run --all-files --show-diff-on-failure

  resolve-e2e-backfill:
    name: Resolve exact-SHA E2E build backfill
    if: inputs.runner_pool != 'image-builder' && inputs.runner_pool != 'image-builder-preflight' && inputs.runner_pool != 'image-builder-provision' && inputs.runner_pool != 'image-builder-network-config'
    runs-on: arc
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      build_needed: ${{ steps.resolve.outputs.build_needed }}
      existing_build_run_id: ${{ steps.resolve.outputs.existing_build_run_id }}
      existing_artifact_id: ${{ steps.resolve.outputs.existing_artifact_id }}
      existing_artifact_digest: ${{ steps.resolve.outputs.existing_artifact_digest }}
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve idempotent exact-SHA build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_BACKFILL: ${{ inputs.e2e_backfill || false }}
          E2E_MERGE_SHA: ${{ inputs.e2e_merge_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "build_needed=true"
            echo "existing_build_run_id="
            echo "existing_artifact_id="
            echo "existing_artifact_digest="
          } >> "$GITHUB_OUTPUT"
          if [[ "$E2E_BACKFILL" != "true" ]]; then
            exit 0
          fi
          [[ "$E2E_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$E2E_MERGE_SHA" ]]
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$E2E_MERGE_SHA" \
            "origin/${{ github.event.repository.default_branch }}"

          runs="$(
            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yaml/runs" \
              -f head_sha="$E2E_MERGE_SHA" \
              -f status=success \
              -f per_page=100
          )"
          while IFS= read -r prior_run_id; do
            [[ -n "$prior_run_id" ]] || continue
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_run_id}/artifacts?per_page=100")"
            artifact="$(
              jq -c '.artifacts | map(select(.name == "nixmac-macos-app-e2e" and .expired == false)) | sort_by(.created_at) | reverse | .[0] // empty' \
                <<<"$artifacts"
            )"
            [[ -n "$artifact" ]] || continue
            {
              echo "build_needed=false"
              echo "existing_build_run_id=$prior_run_id"
              echo "existing_artifact_id=$(jq -r '.id' <<<"$artifact")"
              echo "existing_artifact_digest=$(jq -r '.digest // ""' <<<"$artifact")"
            } >> "$GITHUB_OUTPUT"
            echo "Exact-SHA E2E app artifact already exists; Mac build is idempotently skipped."
            exit 0
          done < <(jq -r '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | reverse | .[].id' <<<"$runs")

  reuse-e2e-backfill:
    name: Materialize reused exact-SHA E2E artifact
    needs: resolve-e2e-backfill
    if: github.event_name == 'workflow_dispatch' && inputs.e2e_backfill == true && needs.resolve-e2e-backfill.outputs.build_needed == 'false'
    runs-on: arc
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download resolver-selected exact artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.resolve-e2e-backfill.outputs.existing_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-e2e-backfill.outputs.existing_build_run_id }}
          path: ${{ runner.temp }}/reused-e2e-artifact
          merge-multiple: true

      - name: Verify reused artifact payload
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/reused-e2e-artifact"
          expected="$artifact_root/nixmac-macos-app-preserved.zip"
          [[ -f "$expected" && ! -L "$expected" ]]
          [[ "$(find "$artifact_root" -type f | wc -l | tr -d ' ')" == "1" ]]
          [[ "$(find "$artifact_root" -type l | wc -l | tr -d ' ')" == "0" ]]
          if unzip -Z1 "$expected" | grep -Eq '(^/|(^|/)\.\.(/|$)|\\)'; then
            echo "Reused E2E app archive contains an unsafe path." >&2
            exit 65
          fi

      - name: Publish reused exact-SHA E2E artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixmac-macos-app-e2e
          path: ${{ runner.temp }}/reused-e2e-artifact/nixmac-macos-app-preserved.zip
          if-no-files-found: error
          retention-days: 90

  rust-tests:
    name: Rust Tests (Linux)
    if: inputs.runner_pool != 'image-builder' && inputs.runner_pool != 'image-builder-preflight' && inputs.runner_pool != 'image-builder-provision' && inputs.runner_pool != 'image-builder-network-config'
    runs-on: arc
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri

      - name: Patch passkey Swift package
        working-directory: apps/native/src-tauri
        run: |
          cargo fetch --locked
          bash "$GITHUB_WORKSPACE/ops/scripts/ci/patch-passkey-swift.sh"

      - name: Rust unit tests
        working-directory: apps/native
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          NIXMAC_ENV: production

  # Decide whether the mac build lands on the dedicated self-hosted mac fleet
  # or on a Depot macOS runner. Prefer self-hosted (flat monthly cost); fall
  # back to Depot (per-minute) when no fleet runner is online AND idle. The
  # fleet is identified by the custom `nixmac-mac` label so that unrelated
  # org mac runners (private groups this public repo can't route to, or
  # future Depot mac runners) never count as available capacity. Runs only
  # after rust-tests so the pool decision is seconds (not a full rust-test
  # duration) stale at dispatch; a runner claimed in that window just queues
  # the build on self-hosted, same as before this job existed.
  pick-mac-runner:
    name: Pick mac runner pool
    if: inputs.runner_pool != 'image-builder' && inputs.runner_pool != 'image-builder-preflight' && inputs.runner_pool != 'image-builder-provision' && inputs.runner_pool != 'image-builder-network-config' && needs.rust-tests.result == 'success' && needs.resolve-e2e-backfill.outputs.build_needed == 'true'
    needs: [rust-tests, resolve-e2e-backfill]
    runs-on: arc
    timeout-minutes: 5
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - name: Mint org token
        id: bot-token
        if: inputs.runner_pool == '' || inputs.runner_pool == 'auto'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DARKMATTER_APP_ID }}
          private-key: ${{ secrets.DARKMATTER_APP_PRIVATE_KEY }}
      - name: Pick pool
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          RUNNER_POOL: ${{ inputs.runner_pool || 'auto' }}
        run: |
          set -uo pipefail
          # Keep the fallback on Sonoma to match the self-hosted pool.
          # setup-xcode pins Xcode 16.1 instead of this image's 15.4 default.
          custom='["self-hosted","macOS","nixmac-custom"]'
          if [ "$RUNNER_POOL" = "custom" ]; then
            echo "runs-on=$custom" | tee -a "$GITHUB_OUTPUT"
            echo "::notice::manual verification requested custom image"
            exit 0
          fi
          # Capability labels make a host eligible only when its installed
          # toolchain satisfies the same pin enforced below. A generic online
          # macOS label is not proof that the host can build this repository.
          self_hosted='["self-hosted","macOS","nixmac-mac","xcode-16.1"]'
          depot='["depot-macos-14"]'
          if [ "$RUNNER_POOL" = "self-hosted" ]; then
            echo "runs-on=$self_hosted" | tee -a "$GITHUB_OUTPUT"
            echo "::notice::manual verification requested self-hosted"
            exit 0
          fi
          if [ "$RUNNER_POOL" = "depot" ]; then
            echo "runs-on=$depot" | tee -a "$GITHUB_OUTPUT"
            echo "::notice::manual verification requested Depot"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org app token unavailable; refusing to guess runner availability"
            exit 1
          fi
          if idle=$(gh api --paginate orgs/darkmatter/actions/runners --jq '.runners[] | select((([.labels[].name] | index("nixmac-mac")) != null) and (([.labels[].name] | index("xcode-16.1")) != null) and .status == "online" and .busy == false) | .name' 2>/dev/null); then
            n=$(printf '%s\n' "$idle" | grep -c . || true)
            if [ "$n" -gt 0 ]; then
              echo "runs-on=$self_hosted" | tee -a "$GITHUB_OUTPUT"
              echo "idle self-hosted mac runners: $n"
            else
              echo "runs-on=$depot" | tee -a "$GITHUB_OUTPUT"
              echo "::notice::no idle self-hosted mac runners; routing to $depot"
            fi
          else
            echo "::error::org runner API failed; refusing to guess runner availability"
            exit 1
          fi
  build:
    needs: pick-mac-runner
    runs-on: ${{ fromJSON(needs.pick-mac-runner.outputs.runs-on) }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: false

      - name: Clean workspace while preserving CI caches
        shell: bash
        run: |
          git reset --hard
          git clean -ffdx -e .devenv/ -e .devenv-ci/

      - name: Setup Nix and caches
        uses: ./.github/actions/setup-nix
        with:
          darkmatter-cachix-auth-token: ${{ secrets.DARKMATTER_CACHIX_AUTH_TOKEN }}

      - name: Setup devenv profile
        uses: ./.github/actions/setup-devenv
        with:
          darkmatter-cachix-auth-token: ${{ secrets.DARKMATTER_CACHIX_AUTH_TOKEN }}

      - name: Setup Xcode Swift toolchain
        uses: ./.github/actions/setup-xcode
        with:
          # Keep release artifacts reproducible across the self-hosted and
          # Depot pools. The custom image lane intentionally validates its
          # own newer Xcode and therefore leaves the preference unset.
          preferred-version: ${{ inputs.runner_pool != 'custom' && '16.1' || '' }}

      # Rust (pinned stable rustc/cargo) comes from the devenv profile above.
      # Do NOT add dtolnay/rust-toolchain here: it installs rustup into the
      # runner's persistent ~/.cargo, and a broken rustup there took down the
      # merge queue ("cannot execute binary file").

      - name: Install frontend dependencies
        run: bun install

      # tauri-plugin-macos-passkey 0.1.0 ships a Swift package declaring
      # swift-tools-version 6.1, but the self-hosted runner has Swift 6.0.2
      # (Xcode 16.1). Fetch crates and lower the declared tools version before
      # syncing the app version: sync-version mutates Cargo.toml, which would
      # make `cargo fetch --locked` fail because Cargo.lock still contains the
      # committed package version.
      - name: Patch passkey Swift package
        working-directory: apps/native/src-tauri
        run: |
          cargo fetch --locked
          bash "$GITHUB_WORKSPACE/ops/scripts/ci/patch-passkey-swift.sh"

      # Lint before the expensive release build. Runs here (not in a Linux
      # job) because this runner already has the full devenv toolchain and
      # macOS SDK, and clippy on macOS covers the cfg(target_os = "macos")
      # code that actually ships. Placed before the sccache setup: sccache as
      # RUSTC_WRAPPER does not reliably cache clippy-driver invocations.
      # nixmac/codegen keeps the feature-gated codegen paths (gen-schemas,
      # gen-orpc, gen-docs-index, specta_gen_ts) covered by the lint even
      # though release builds exclude them.
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --features nixmac/codegen -- -D warnings
        env:
          NIXMAC_ENV: prod

      # Decide what kind of build this is:
      #   - tag:     push of refs/tags/v* → ship that exact version on stable
      #   - develop: push to main → ship on the develop channel
      #   - branch:  PR / feature branch / workflow_dispatch → build-only
      #
      # Tags are the source of truth for shipped (stable) versions. Pushes to
      # main land on the develop channel; the stable channel only updates when
      # a release is created in GitHub (which pushes a v* tag).
      - name: Compute release version
        id: release-version
        run: bash ops/scripts/release/compute-version.sh

      - name: Setup sccache
        shell: bash
        run: |
          if ! command -v sccache &>/dev/null; then
            brew install sccache 2>/dev/null || cargo install sccache 2>/dev/null || true
          fi
          # cargo install lands in ~/.cargo/bin, which is not on PATH (rustup
          # is intentionally absent); resolve an absolute path for RUSTC_WRAPPER.
          SCCACHE_BIN="$(command -v sccache || true)"
          if [ -z "$SCCACHE_BIN" ] && [ -x "$HOME/.cargo/bin/sccache" ]; then
            SCCACHE_BIN="$HOME/.cargo/bin/sccache"
          fi
          mkdir -p "$RUNNER_TEMP/sccache"
          if [ -n "$SCCACHE_BIN" ]; then
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=$SCCACHE_BIN" >> "$GITHUB_ENV"
          else
            echo "::notice::sccache unavailable; building without a compiler cache."
          fi

      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-
      # Sync native app version files. Tag + develop modes use the computed
      # version directly; branch/PR builds fall back to the max(package.json,
      # latest-git-tag) guard so a stale package.json cannot embed a version
      # lower than what has already shipped (which would trigger a
      # false-positive update banner, e.g. embedding 0.5.0 when latest.json is
      # 0.16.2).
      - name: Sync native app version
        id: sync-version
        env:
          RELEASE_MODE: ${{ steps.release-version.outputs.mode }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: bash ops/scripts/release/sync-version.sh
      - name: Check for code signing secrets
        id: check-secrets
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "has_certificate=true" >> $GITHUB_OUTPUT
          else
            echo "has_certificate=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "has_notarization=true" >> $GITHUB_OUTPUT
          else
            echo "has_notarization=false" >> $GITHUB_OUTPUT
          fi
      # Build the Tauri app (TAURI_SIGNING_PRIVATE_KEY + PASSWORD come from sops)
      # NOTE: Certificate import is intentionally deferred until after this step.
      # Running `security list-keychain -d user -s <keychain>` before the build
      # replaces the keychain search list and breaks DMG bundling on tag runs.
      - name: Build Tauri app
        run: |
          # unset the certificate and password so the runner can't influence the build
          export APPLE_SIGNING_IDENTITY="-"
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD
          bun run desktop:build
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass DSNs and build metadata into the tauri action step so build.rs can read them
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NIXMAC_ENV: prod
          NIXMAC_VERSION: ${{ steps.sync-version.outputs.build_version }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          SUBMITTED_FEEDBACK_DSN: ${{ secrets.SUBMITTED_FEEDBACK_DSN }}

      - name: Unit Test frontend
        working-directory: apps/native
        run: bun run test:unit

      - name: Save sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # Import Apple Developer certificate (only for releases with secrets).
      # Placed AFTER the Tauri build to avoid replacing the keychain search list
      # before `bun run desktop:build`, which caused DMG bundling failures on tags.
      # The normalizer needs this keychain to re-sign updater archives after
      # install-name rewrites mutate the embedded app bundle.
      - name: Import Apple Developer certificate
        if: steps.check-secrets.outputs.has_certificate == 'true'
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: bash ops/scripts/release/import-certificate.sh
      - name: Normalize macOS system install names
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: |
          set -euo pipefail

          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | sed -n '1p' || true)
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | sed -n '1p' || true)
          TAR_GZ_PATH=$(find target/release/bundle -name "*.app.tar.gz" -not -name "*.sig" -type f 2>/dev/null | sed -n '1p' || true)

          if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ] || [ -z "$TAR_GZ_PATH" ]; then
            echo "ERROR: missing app, DMG, or updater archive for install-name normalization (APP_PATH=$APP_PATH DMG_PATH=$DMG_PATH TAR_GZ_PATH=$TAR_GZ_PATH)"
            exit 1
          fi

          bash ops/scripts/release/normalize-macos-install-names.sh "$APP_PATH" "$DMG_PATH" "$TAR_GZ_PATH"

      # Sign the app bundle (required for notarization)
      - name: Sign app bundle
        run: bash ops/scripts/release/sign-app.sh
      # Install deterministic Finder metadata into the DMG. Tauri copies
      # .background/dmg-background.png, but our CI hosts do not reliably emit
      # root .DS_Store; without it Finder opens a plain white installer window.
      # The script mount-verifies .DS_Store, .background, Applications link,
      # and the signed app before notarization/upload.
      - name: Install DMG Finder layout metadata
        if: steps.check-secrets.outputs.has_certificate == 'true'
        run: |
          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | sed -n '1p' || true)
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | sed -n '1p' || true)
          bash ops/scripts/release/rebuild-dmg-with-layout.sh "$APP_PATH" "$DMG_PATH"
      # Notarize the app (requires Apple Developer account)
      - name: Notarize app
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        run: bash ops/scripts/release/notarize.sh
      - name: Check macOS app portability
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | sed -n '1p' || true)
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | sed -n '1p' || true)
          TAR_GZ_PATH=$(find target/release/bundle -name "*.app.tar.gz" -not -name "*.sig" -type f 2>/dev/null | sed -n '1p' || true)

          if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ] || [ -z "$TAR_GZ_PATH" ]; then
            echo "ERROR: missing app, DMG, or updater archive for portability check (APP_PATH=$APP_PATH DMG_PATH=$DMG_PATH TAR_GZ_PATH=$TAR_GZ_PATH)"
            exit 1
          fi

          bash ops/scripts/release/check-portable-macos-app.sh "$APP_PATH" "$DMG_PATH" "$TAR_GZ_PATH"
      - name: Get artifact paths
        id: artifacts
        run: |
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | head -1 || echo "")
          APP_PATH=$(find target/release/bundle/macos -name "*.app" -type d 2>/dev/null | head -1 || echo "")

          {
            echo "dmg_path=$DMG_PATH"
            echo "app_path=$APP_PATH"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$DMG_PATH" ]; then
            echo "dmg_name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixmac-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
      - name: Package metadata-preserving app archive for E2E
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find target/release/bundle/macos -name '*.app' -type d | sed -n '1p')"
          [[ -n "$app_path" ]]
          rm -f target/release/bundle/macos/nixmac-macos-app-preserved.zip
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            target/release/bundle/macos/nixmac-macos-app-preserved.zip
      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixmac-macos-app
          path: target/release/bundle/macos/*.app
          if-no-files-found: warn
          include-hidden-files: true
      - name: Upload metadata-preserving E2E app artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixmac-macos-app-e2e
          path: target/release/bundle/macos/nixmac-macos-app-preserved.zip
          if-no-files-found: error
          retention-days: 90
      # Create GitHub Release for tag pushes only. The stable channel only
      # updates when a release is created in GitHub (via a pushed v* tag);
      # main pushes land on the develop channel. Skipped for test tags
      # matching `-test.N` so we can exercise the full signing/notarization +
      # DMG swap path on a disposable tag without publishing a public release.
      - name: Create Release
        if: (github.event_name != 'workflow_dispatch' || inputs.runner_pool != 'custom') &&
          steps.release-version.outputs.mode == 'tag' &&
          !contains(steps.release-version.outputs.tag, '-test.')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          tag_name: ${{ steps.release-version.outputs.tag }}
          files: |
            target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Upload to R2 for auto-updater (R2 creds come from sops).
      # tag → stable channel; develop (main push) → develop channel.
      # Skipped for test tags matching `-test.N` so we can exercise the full
      # signing/notarization + DMG swap path on a disposable tag without
      # overwriting latest.json on the updater CDN.
      - name: Upload to R2
        if: (github.event_name != 'workflow_dispatch' || inputs.runner_pool != 'custom') &&
          (steps.release-version.outputs.mode == 'tag' ||
          steps.release-version.outputs.mode == 'develop') &&
          !contains(steps.release-version.outputs.tag, '-test.')
        shell: 'sops exec-env ops/secrets/secrets.sops.json "bash -e {0}"'
        env:
          AWS_DEFAULT_REGION: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          UPDATE_CHANNEL: ${{ steps.release-version.outputs.mode == 'develop' && 'develop' || 'stable' }}
        run: bash ops/scripts/release/upload-r2.sh
      # Sync the shipped release to Linear so issues referenced in commits since
      # the previous release get linked. Runs only after R2 upload succeeds, so
      # Linear releases track what actually shipped. Skipped for `-test.N` tags
      # to match the GitHub Release / R2 upload skip.
      - name: Sync release to Linear
        if: (github.event_name != 'workflow_dispatch' || inputs.runner_pool != 'custom') &&
          steps.release-version.outputs.mode == 'tag' &&
          !contains(steps.release-version.outputs.tag, '-test.')
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ steps.release-version.outputs.version }}
          name: nixmac v${{ steps.release-version.outputs.version }}
      - name: Cleanup keychain
        if: always()
        run: bash ops/scripts/release/cleanup-keychain.sh
