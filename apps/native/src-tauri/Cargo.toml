[package]
name = "nixmac"
version = "0.22.0"
description = "Nixmac - macOS nix-darwin configuration manager"
authors = ["Darkmatter Labs"]
license = "MIT"
edition = "2024"
default-run = "nixmac"

[lints]
workspace = true

[features]
# Dev-time codegen commands (`gen-schemas`, `gen-orpc`, `gen-docs-index`,
# `specta_gen_ts` example); excluded from release builds.
codegen = ["dep:specta-typescript"]

[[example]]
name = "specta_gen_ts"
required-features = ["codegen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
# Writes the build-ID-stamped Info.plist the bundler merges; the crate reads the
# same key back out of an installed bundle (`build_id.rs`).
plist = "1.10.0"

[dependencies]
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  "image-png",
  "protocol-asset",
] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-positioner = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-process = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-websocket = "2.0.0"
tauri-plugin-window-state = "2.0.0"
tauri-plugin-notification = "2"

git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tauri-plugin-keyring = "0.1.0"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
dirs = "5"
tempfile = "3.23.0"
async-openai = "0.30.1"
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1.21.3"
reqwest = { version = "0.12", features = ["json", "blocking", "cookies", "stream"] }
reqwest-middleware = { version = "0.4", features = ["json", "charset"] }
reqwest-tracing = { version = "0.5", features = ["opentelemetry_0_29"] }
http = "1"
diesel = { version = "2", features = ["sqlite", "r2d2"] }
diesel_migrations = "2"
r2d2 = "0.8"
# Pin libsqlite3-sys with bundled so diesel and sqlx use a self-contained
# sqlite rather than a system one.
#
# 0.30 specifically: `links = "sqlite3"` allows one version in the graph.
# `sqlx-sqlite` 0.8.1+ needs ^0.30.1 and diesel accepts >=0.17.2, <0.39, so
# 0.30 is the only overlap. 0.28 leaves sqlx on 0.8.0 (RUSTSEC-2024-0363);
# 0.31+ does not resolve at all.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tauri-plugin-upload = "2.0.0"
tauri-plugin-macos-permissions = "2.3.0"
tracing = "0.1"
sha2 = "0.10.9"
hex = "0.4.3"
regex = "1.12.3"
tauri-plugin-http = "2"
fancy-regex = "0.17.0"
regex-syntax = "0.8"
toml = "1.0.3"
backtrace = "0.3"
clap = { version = "4", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = { version = "0.0.9", optional = true }
rnix = "0.14.0"
serde_yaml = "0.9"
rowan = "0.16.1"
fuzzy-matcher = "0.3.7"
tauri-plugin-webdriver-automation = "0.1.3"
tiktoken-rs = "0.6"
url = "2"
opentelemetry = "0.29"
opentelemetry_sdk = "0.29"
opentelemetry-otlp = { version = "0.29", features = [
  "trace",
  "logs",
  "http-proto",
  "reqwest-client",
] }
opentelemetry-appender-tracing = "0.29"
tracing-opentelemetry = "0.30"
configurable = { path = "configurable" }
activation-runner = { path = "activation-runner" }
hmac = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
plist = "1.10.0"
whoami = "2.1.2"
libc = "0.2"
orpc = "1.1.0"
orpc-specta = "1.1.0"
tauri-plugin-orpc = "1.1.0"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-macos-passkey = "0.1.0"
ignore = "0.4.31"

# Vendored Oh My Pi extracts (not wired into evolve tools yet).
# See crates/vendor/oh-my-pi/VENDOR.md
pi-walker = { path = "../../../crates/vendor/oh-my-pi/pi-walker" }
pi-uutils-ctx = { path = "../../../crates/vendor/oh-my-pi/pi-uutils-ctx" }
pi_uu_grep = { path = "../../../crates/vendor/oh-my-pi/pi-uu-grep" }
pi-iso = { path = "../../../crates/vendor/oh-my-pi/pi-iso" }
pi-ast = { path = "../../../crates/vendor/oh-my-pi/pi-ast" }

[dependencies.tauri-plugin-sql]
features = ["sqlite"] # or "postgres", or "mysql"
version = "2.0.0"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2.0.0"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
core-foundation = "0.10"
security-framework = "3"
nix = { version = "0.31", features = ["socket", "user"] }
# Named `errSecCS*` / `errSecCertificate*` / `CSSMERR_TP_*` status values,
# generated from the Security.framework headers, for the privileged-helper peer
# auth status table. A name that does not exist fails the build, where a
# hand-transcribed number was silently wrong — and a wrong number there can
# classify a peer nobody could judge as invalid, which authorizes removal.
#
# macOS-gated because it cannot build off Apple: 0.3.2 declares `mod generated`
# with no cfg and an unconditional `#[link(name = "Security", kind =
# "framework")]`, which rustc rejects with E0455 on other targets. The status
# table it feeds is therefore macOS-only too, and so are that table's tests —
# they run on the macOS runner, which executes `cargo test` alongside clippy.
objc2-security = { version = "0.3.2", default-features = false, features = [
  "CSCommon",
  "SecBase",
  "cssmerr",
] }
# SMAppService bindings for the privileged-helper registration
# (`privileged_helper/service.rs`). Generated from the SDK headers, so the
# asynchronous `unregisterWithCompletionHandler:` and the typed status enum are
# both reachable — the two things the published wrapper crates
# (`smappservice-rs`, `servicemanagement-rs`) do not offer.
objc2-service-management = { version = "0.3.2", default-features = false, features = [
  "std",
  "SMAppService",
  "SMErrors",
  "block2",
  "objc2",
  "objc2-foundation",
] }
# Already in the tree through the objc2 framework crates; declared directly
# because the SMAppService adapter constructs NSString/NSError values, retains
# the unregister completion block, and hops onto the main queue itself.
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSThread",
] }
block2 = "0.6"
dispatch2 = "0.3"
# Typed `NSWindow` bindings for the floating-panel setup in `peek.rs` and the
# `NIXMAC_E2E_OPAQUE_WINDOW` diagnostic in `main.rs`. Already in the tree
# through Tauri; declared directly with the exact features this code uses, so
# the build does not depend on Tauri's own feature selection.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
  "objc2-core-foundation",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user"] }

[dependencies.tera]
version = "1"

[dev-dependencies]
# Enables `tauri::test` (mock runtime). Dev-only: with resolver "2" this feature
# is not unified into normal/release builds of the binary.
tauri = { version = "2", features = ["test"] }
